<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte — Linkora</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">L</div>

            <h1>Créer un compte</h1>

            <p>Rejoins Linkora 🚀</p>

            <form method="POST" action="{{ url_for('register') }}">

                <input
                    type="text"
                    name="username"
                    placeholder="Nom d'utilisateur"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Adresse email"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Mot de passe"
                    required
                >

                <button type="submit">
                    Créer mon compte
                </button>

            </form>

            <p class="auth-link">
                Tu as déjà un compte ?
                <a href="{{ url_for('login') }}">Se connecter</a>
            </p>

        </div>

    </main>

</body>
</html>
